<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calculate tips and split bills easily with the Tip Calculator."
    />
    <title>Frontend Mentor | Tip Calculator App</title>
  </head>
  <body>
    <!-- Main Container -->
    <main
      class="bg-grey-200 min-h-screen flex flex-col items-center pt-14 md:py-44"
    >
      <!-- Logo -->
      <header class="mb-14 md:mb-24">
        <img src="/images/logo.svg" alt="logo" class="w-28 md:w-24" />
      </header>

      <!-- Calculator Card Section -->
      <div
        class="w-full max-w-4xl bg-white rounded-t-3xl px-6 py-8 flex flex-col md:max-w-5xl md:flex-row md:p-10 md:rounded-3xl md:gap-10"
      >
        <!-- Input Section -->
        <section class="flex flex-col px-2 md:basis-1/2">
          <div class="flex flex-col gap-1 mb-10">
            <label for="bill" class="text-lg mb-1">Bill</label>
            <div class="relative">
              <img
                src="/images/icon-dollar.svg"
                alt="dollar-icon"
                class="absolute left-4 top-1/2 -translate-y-1/2 text-grey-500 w-3.5"
              />
              <input
                type="number"
                name="bill"
                id="bill"
                min="0"
                step="0.01"
                class="no-spinner w-full text-right bg-grey-50 rounded-md text-green-900 px-4 py-2 text-3xl cursor-pointer hover:border-2 hover:border-green focus:border-2 focus:border-green transition-all duration-200 outline-none"
                placeholder="0"
              />
            </div>
          </div>

          <fieldset class="">
            <legend class="text-lg mb-5">Select Tip %</legend>
            <div class="grid grid-cols-2 gap-4 mb-10 md:grid-cols-3">
              <button
                type="button"
                class="tipBtn bg-green-900 text-white rounded-sm py-2 px-4 text-[26px] cursor-pointer hover:bg-green hover:text-green-900 focus:bg-green focus:text-green-900 transition-all duration-200 outline-none"
                data-tip="5"
                id="tipButtons"
              >
                5%
              </button>
              <button
                type="button"
                class="tipBtn bg-green-900 text-white rounded-sm py-2 px-4 text-[26px] cursor-pointer hover:bg-green hover:text-green-900 focus:bg-green focus:text-green-900 transition-all duration-200 outline-none"
                data-tip="10"
                id="tipButtons"
              >
                10%
              </button>
              <button
                type="button"
                class="tipBtn bg-green-900 text-white rounded-sm py-2 px-4 text-[26px] cursor-pointer hover:bg-green hover:text-green-900 focus:bg-green focus:text-green-900 transition-all duration-200 outline-none"
                data-tip="15"
                id="tipButtons"
              >
                15%
              </button>
              <button
                type="button"
                class="tipBtn bg-green-900 text-white rounded-sm py-2 px-4 text-[26px] cursor-pointer hover:bg-green hover:text-green-900 focus:bg-green focus:text-green-900 transition-all duration-200 outline-none"
                data-tip="25"
                id="tipButtons"
              >
                25%
              </button>
              <button
                type="button"
                class="tipBtn bg-green-900 text-white rounded-sm py-2 px-4 text-[26px] cursor-pointer hover:bg-green hover:text-green-900 focus:bg-green focus:text-green-900 transition-all duration-200 outline-none"
                data-tip="50"
                id="tipButtons"
              >
                50%
              </button>
              <input
                type="number"
                id="customTip"
                name="customTip"
                class="no-spinner bg-grey-50 rounded-sm py-2 px-4 text-[26px] text-right cursor-pointer hover:border-2 hover:border-green focus:border-2 focus:border-green transition-all duration-200 outline-none"
                placeholder="Custom"
              />
            </div>

            <div class="flex flex-col gap-1 mb-6">
              <div class="flex justify-between items-center">
                <label for="numberOfPeople" class="text-lg mb-1"
                  >Number of people</label
                >
                <span id="peopleError" class="text-red-500 text-sm"></span>
              </div>
              <div class="relative">
                <img
                  src="/images/icon-person.svg"
                  alt="dollar-icon"
                  class="absolute left-4 top-1/2 -translate-y-1/2 text-grey-500 w-4"
                />
                <input
                  type="number"
                  name="numberOfPeople"
                  id="numberOfPeople"
                  min="1"
                  step="1"
                  class="no-spinner w-full text-right bg-grey-50 rounded-md text-green-900 px-4 py-2 text-3xl cursor-pointer hover:border-2 hover:border-green focus:border-2 focus:border-green transition-all duration-200 outline-none"
                  placeholder="0"
                />
              </div>
            </div>
          </fieldset>
        </section>

        <!-- Result Section -->
        <section
          class="bg-green-900 px-6 pt-10 pb-6 flex flex-col gap-8 rounded-2xl md:basis-1/2 md:justify-between md:px-10 md:py-12"
        >
          <div class="flex flex-col gap-8">
            <div class="flex justify-between items-center">
              <div class="">
                <h2 class="text-grey-50 md:text-lg">Tip Amount</h2>
                <p class="text-sm md:text-base">/ person</p>
              </div>

              <output
                id="tipAmount"
                aria-live="polite"
                class="text-4xl text-green md:text-5xl"
                >$0.00</output
              >
            </div>
            <div class="flex justify-between items-center">
              <div>
                <h2 class="text-grey-50 md:text-lg">Total</h2>
                <p class="text-sm md:text-base">/ person</p>
              </div>

              <output
                id="totalAmount"
                aria-live="polite"
                class="text-4xl text-green md:text-5xl"
                >$0.00</output
              >
            </div>
          </div>

          <button
            type="button"
            id="resetBtn"
            class="bg-green text-green-900 rounded-sm py-3 uppercase text-2xl cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed outline-none"
            disabled
          >
            Reset
          </button>
        </section>
      </div>

      <!-- Footer -->
      <footer class="text-sm text-center my-4">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a
        >. Coded by
        <a href="https://github.com/CodeLord36">CodeLord36</a>
      </footer>
    </main>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
